<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Real-Time Chat</title>
    <!-- Include Socket.io client library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 10px; }
        #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #f9f9f9; border-radius: 5px; }
        #input-container { display: flex; gap: 10px; }
        #message-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .msg { margin-bottom: 10px; padding: 8px 12px; background: #e1ffc7; border-radius: 5px; width: fit-content; max-width: 80px; }
    </style>
</head>
<body>

    <h2>Real-Time Chat</h2>
    <div id="info-box">
        <p id="user-count" >0 users online</p>
    </div>

    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        // Connect to the Flask-SocketIO backend
        const socket = io();

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Listen for incoming messages from the server
        socket.on('message', (msg) => {
            const msgElement = document.createElement('div');
            msgElement.classList.add('msg');
            msgElement.textContent = msg;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to the bottom
        });

        // Function to send a message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message !== "") {
                socket.send(message, { username: username, socketId: socket.id }); // Emit 'message' event to backend
                messageInput.value = "";
            }
        }

        // Send via button click or Enter key
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        //onpage load prompt username
        let username = prompt("Enter your username:");
        if (!username) {
            username = "Anonymous";
        }
        socket.on('connect', () => {
            socket.send(`${username} has joined the chat`, { username: username, socketId: socket.id });
        });
        
        socket.on('disconnect', () => {
            socket.send(`${username} has left the chat`);
        });
    </script>
</body>
</html>
